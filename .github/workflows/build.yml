name: build

# 全平台构建：Android APK、Linux 桌面、Windows 桌面。
# 触发：推送到 main、打 v* 标签，或手动在 Actions 页面点「Run workflow」。
# 产物上传为 artifact，可在 Actions 页面下载；不自动发 release（避免额外权限）。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Gradle 7.4 需要 JDK 11-17（不支持 18+）。
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 3.0.0 与 pubspec.lock 锁定版本一致。
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.0'
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: moepick-android
          path: build/app/outputs/flutter-apk/app-release.apk

  linux:
    name: Linux 桌面
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.0'
          channel: stable
          cache: true

      # Linux 桌面构建需要 GTK3 开发库、ninja，以及 flutter_secure_storage
      # 依赖的 libsecret。
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Linux 桌面
        run: flutter build linux --release

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: moepick-linux
          path: build/linux/x64/release/bundle

  windows:
    name: Windows 桌面
    runs-on: windows-2022
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Flutter 3.0.0 的 VS 检测只认 Visual Studio 2019，而 windows-2022 runner
      # 只装 VS 2022，会报「Visual Studio 16 2019 could not find any instance」。
      # 改用 3.7.12（Dart 2.19，仍满足 pubspec 的 <3.0.0 约束），其对 VS 2022
      # 的支持已成熟。仅 Windows job 用此版本，Android/Linux 保持 3.0.0。
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      # 诊断工具链：确认 Visual Studio 2022 与 C++ 组件是否就绪。
      - name: 诊断工具链
        run: flutter doctor -v

      # windows-2022 runner 预装 Visual Studio 2022 + C++ 桌面工作负载。
      - name: 构建 Windows 桌面
        run: flutter build windows --release

      # 列出 build 目录，便于定位产物实际路径。
      - name: 列出产物
        run: |
          echo "=== build/windows 目录树 ==="
          find build/windows -maxdepth 4 -type d 2>/dev/null || true
          echo "=== exe / dll 文件 ==="
          find build/windows -name "*.exe" -o -name "*.dll" 2>/dev/null | head -50 || true

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: moepick-windows
          path: build/windows/x64/runner/Release
