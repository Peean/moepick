name: build

# 全平台构建 + 发布：
# - 推送到 main：三平台构建，产物上传为 artifact（可在 Actions 页面下载）
# - 打 v* 标签：额外创建 GitHub Release 并上传三平台产物
# - 手动：Actions 页面「Run workflow」
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Gradle 7.4 需要 JDK 11-17（不支持 18+）。
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 3.0.0 与 pubspec.lock 锁定版本一致。
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.0'
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      # 从 GitHub Secrets 还原正式 keystore，保证与本地构建签名一致。
      # Secrets 未配置时跳过，回退 debug 签名（产物仍可安装，但无法覆盖升级）。
      - name: 还原签名密钥
        if: secrets.KEYSTORE_BASE64 != ''
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/moepick-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=moepick-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: 构建 APK
        run: flutter build apk --release

      - name: 重命名 APK
        run: cp build/app/outputs/flutter-apk/app-release.apk moepick-android.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: moepick-android
          path: moepick-android.apk

  linux:
    name: Linux 桌面
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.0'
          channel: stable
          cache: true

      # Linux 桌面构建需要 GTK3 开发库、ninja，以及 flutter_secure_storage
      # 依赖的 libsecret。
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev zip

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Linux 桌面
        run: flutter build linux --release

      - name: 打包 Linux 产物
        run: |
          cd build/linux/x64/release
          zip -r moepick-linux-x64.zip bundle

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: moepick-linux
          path: build/linux/x64/release/moepick-linux-x64.zip

  windows:
    name: Windows 桌面
    runs-on: windows-2022
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Flutter 3.0.0 的 VS 检测只认 Visual Studio 2019，而 windows-2022 runner
      # 只装 VS 2022，会报「Visual Studio 16 2019 could not find any instance」。
      # 改用 3.7.12（Dart 2.19，仍满足 pubspec 的 <3.0.0 约束），其对 VS 2022
      # 的支持已成熟。仅 Windows job 用此版本，Android/Linux 保持 3.0.0。
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      # windows-2022 runner 预装 Visual Studio 2022 + C++ 桌面工作负载。
      # 注意：Flutter 3.7 的产物路径是 build/windows/runner/Release（无 x64 层）。
      - name: 构建 Windows 桌面
        run: flutter build windows --release

      - name: 打包 Windows 产物
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/runner/Release/* -DestinationPath moepick-windows-x64.zip

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: moepick-windows
          path: moepick-windows-x64.zip

  # 仅在打 v* 标签时运行：汇总三平台产物，创建 GitHub Release 并上传。
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 下载 Android 产物
        uses: actions/download-artifact@v4
        with:
          name: moepick-android
          path: release-assets

      - name: 下载 Linux 产物
        uses: actions/download-artifact@v4
        with:
          name: moepick-linux
          path: release-assets

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: moepick-windows
          path: release-assets

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
