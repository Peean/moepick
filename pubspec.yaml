name: moepick
description: 拾萌 - 表情包收藏与管理工具 (MoePick - sticker pack manager)
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- 状态管理 / 路由 ---
  # State management / routing (go_router 5.x requires Flutter >= 3.3)
  flutter_riverpod: ^2.3.7
  go_router: ^4.5.1

  # --- 本地存储 / Local storage ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15
  # NOTE: path 1.8.2 conflicts with flutter_test's pinned 1.8.1 on Flutter 3.0
  path: ^1.8.1
  shared_preferences: ^2.1.1
  flutter_secure_storage: ^7.0.0

  # --- 图片导入 / Image import ---
  # Android: image_picker; Windows: file_selector + desktop_drop
  # (image_picker & file_picker have NO Windows implementation)
  image_picker: ^0.8.7
  file_selector: ^0.9.2
  desktop_drop: ^0.4.1

  # --- 图片处理与展示 / Image processing & viewing ---
  image: ^4.2.0
  photo_view: ^0.14.0
  blur: ^3.1.0

  # --- 分享 / 权限 ---
  share_plus: ^6.3.4
  permission_handler: ^10.4.5

  # --- 备份与同步 / Backup & sync ---
  archive: ^3.3.2
  crypto: ^3.0.2
  webdav_client: ^1.1.8
  dio: ^4.0.6
  connectivity_plus: ^2.3.9

  # --- 文件保存/选择 / File save & pick ---
  # Android 上用于系统「保存到…」与「选择文件」对话框（file_selector 仅桌面可用）
  file_picker: ^5.2.10

  # --- 工具 / Utilities ---
  uuid: ^3.0.7
  intl: any
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
